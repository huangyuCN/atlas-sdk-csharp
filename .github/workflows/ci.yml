name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # golden vectors 由主仓生成（transport/frame -update），本仓消费同一份
      # manifest + 向量——协议一致性锚点（规范 §8.1）。atlas 为私有仓：检出用
      # 只读 PAT（fine-grained，仅授 atlas 仓 Contents:Read），经
      # secrets.ATLAS_CI_TOKEN 注入（对齐 sdk-go/sdk-ts CI）；未配置时守卫步骤
      # 给出配置指引后失败。
      - name: 校验向量源仓访问凭证
        env:
          TOKEN_SET: ${{ secrets.ATLAS_CI_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::缺少 secrets.ATLAS_CI_TOKEN（只读 PAT，授 atlas 仓 Contents:Read）。"
            echo "配置指引：GitHub 仓 Settings → Secrets and variables → Actions →"
            echo "New repository secret → 名称 ATLAS_CI_TOKEN → 值 PAT。"
            exit 1
          fi

      - name: Checkout atlas (golden vectors)
        uses: actions/checkout@v5
        with:
          repository: huangyuCN/atlas
          ref: feat/actor
          path: atlas
          token: ${{ secrets.ATLAS_CI_TOKEN }}

      # 会话协议唯一来源是模板仓（R13）：descriptor set 从模板导出，帧常量与生成器
      # 取自框架仓——「重生成无 diff」门禁需要三个检出（同一只读 PAT）。
      - name: Checkout atlas-game-layout (会话协议来源)
        uses: actions/checkout@v5
        with:
          repository: huangyuCN/atlas-game-layout
          ref: main
          path: atlas-game-layout
          token: ${{ secrets.ATLAS_CI_TOKEN }}

      - name: Set up Go (构建 protoc-gen-atlas-client)
        uses: actions/setup-go@v5
        with:
          # 与框架仓 go.mod 的 go 指令同源（生成器构建版本不得低于框架要求）。
          go-version-file: atlas/go.mod

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 生成物（帧常量快照 + 会话 DTO/stub，含 src/Atlas/Frame/Gen/FrameGen.cs 与
      # examples/Smoke/Proto/gen/**）全部已提交入库；重生成验证——产物与上游不一致
      # 即 CI 失败（防手改产物或上游漂移）。
      - name: Install protoc
        run: |
          PROTOC_VERSION=26.1
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      - name: Verify DTO regenerated
        env:
          ATLAS_DIR: ${{ github.workspace }}/atlas
          ATLAS_LAYOUT_DIR: ${{ github.workspace }}/atlas-game-layout
        run: |
          bash scripts/gen-dto.sh
          # 口径与 sdk-go/sdk-ts 统一：整仓检查（未跟踪的新产物同样算改动）。
          # 上游两仓检出在本仓工作区内（path: atlas / atlas-game-layout），其未跟踪目录
          # 不代表本仓产物改动，必须排除（':!' 为 git pathspec 排除语法）。
          if [ -n "$(git status --porcelain -- . ':!atlas' ':!atlas-game-layout')" ]; then
            echo "::error::重生成产生未入库改动（生成物与上游不同源）"
            git status --porcelain -- . ':!atlas' ':!atlas-game-layout'
            exit 1
          fi

      - name: Restore
        run: dotnet restore Atlas.sln

      - name: Test (golden vectors)
        env:
          ATLAS_GOLDEN_DIR: ${{ github.workspace }}/atlas/testdata/golden
        run: dotnet test Atlas.sln --no-restore

      - name: Format check
        run: dotnet format Atlas.sln --verify-no-changes --no-restore
